name: Extension tests

on:
  pull_request:
    paths:
      - "background.js"
      - "content.js"
      - "extension/**"
      - "icons/**"
      - "vendor/**"
      - "manifest.json"
      - "popup.html"
      - "sidepanel.js"
      - "settings.html"
      - "settings.js"
      - "settings.css"
      - "styles.css"
      - "tests/**"
      - "scripts/package-extension.sh"
      - ".github/workflows/extension-tests.yml"
  push:
    branches:
      - main
      - "phase-1-*"
    paths:
      - "background.js"
      - "content.js"
      - "extension/**"
      - "icons/**"
      - "vendor/**"
      - "manifest.json"
      - "popup.html"
      - "sidepanel.js"
      - "settings.html"
      - "settings.js"
      - "settings.css"
      - "styles.css"
      - "tests/**"
      - "scripts/package-extension.sh"
      - ".github/workflows/extension-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check extension JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check sidepanel.js
          node --check settings.js
          node --check extension/auth.js
          node --check extension/config.js
          node --check extension/usage-display.mjs
          node --check vendor/readability.js
      - name: Run extension regression tests
        run: node --test tests/*.test.mjs
      - name: Package Chrome Web Store extension
        run: bash scripts/package-extension.sh
      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: hookengine-chrome-web-store
          path: dist/hookengine-chrome-web-store.zip
          if-no-files-found: error
