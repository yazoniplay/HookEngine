<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HookEngine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="brand" href="#" aria-label="HookEngine home"><img class="brand-icon" src="icons/icon32.png" alt="" width="24" height="24"><span>HookEngine</span></a>
    <div class="top-actions">
      <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
      <span id="statusLabel" class="status-label"><i></i> Ready</span>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </header>

  <p id="usageLine" class="usage-line muted" hidden></p>

  <section class="source-section">
    <div class="section-head"><h1>Make posts from this page</h1><span id="sourceLabel" class="source-label">No source</span></div>
    <div class="source-actions">
      <button id="extractBtn" class="source-action source-action-primary" type="button">
        <span class="source-action-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span>
        <span class="source-action-copy"><strong>Read current page</strong><small>Extract the article from this tab</small></span>
        <span class="source-action-arrow" aria-hidden="true">→</span>
      </button>
      <button id="analyzeVideoBtn" class="source-action source-action-video" type="button">
        <span class="source-action-icon youtube-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/><path fill="var(--bg)" stroke="none" d="m9.6 15.5 6.2-3.5-6.2-3.5z"/></svg></span>
        <span class="source-action-copy"><strong>Analyze YouTube video</strong><small>Turn a video's content into drafts · 5 credits</small></span>
        <span class="source-action-arrow" aria-hidden="true">→</span>
      </button>
      <button id="selectionBtn" class="selection-action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M4 9h10M4 13h16M4 17h10"/><path d="M18 16v5m-2.5-2.5h5"/></svg> Use selected text instead</button>
    </div>
    <textarea id="sourceText" rows="5" maxlength="60000" placeholder="Paste an article or transcript, or read the current page…"></textarea>
    <div class="source-meta"><span id="charCount">0 characters</span><button id="clearSourceBtn" class="text-button" type="button">Clear</button></div>
    <label class="field-label" for="sourceTitle">Title <span>Optional</span></label>
    <input id="sourceTitle" type="text" placeholder="Source title">
    <input id="sourceUrl" type="hidden">
  </section>

  <section class="platform-section">
    <div class="section-head"><h2>Make drafts for</h2><span id="platformCount" class="source-label">3 selected</span></div>
    <div id="platformPicker" class="platform-picker">
      <label class="platform-option"><input type="checkbox" value="x_thread" checked><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.4l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z"/></svg></span><span class="platform-copy"><span class="platform-name">X</span><span class="platform-detail">Thread</span></span></label>
      <label class="platform-option"><input type="checkbox" value="linkedin_post" checked><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M20.4 2H3.6A1.6 1.6 0 0 0 2 3.6v16.8A1.6 1.6 0 0 0 3.6 22h16.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 20.4 2ZM8 18H5V9h3v9ZM6.5 7.8a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4ZM19 18h-3v-4.4c0-1.1 0-2.5-1.5-2.5S12.8 12.3 12.8 13.5V18h-3V9h2.9v1.2h.1A3.2 3.2 0 0 1 15.7 8c3.1 0 3.3 2 3.3 4.5V18Z"/></svg></span><span class="platform-copy"><span class="platform-name">LinkedIn</span><span class="platform-detail">Post</span></span></label>
      <label class="platform-option"><input type="checkbox" value="tiktok_hooks" checked><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M19.6 6.2a5.2 5.2 0 0 1-3.2-4.5V1h-4.1v15.2a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .9.1v-4.2a7.3 7.3 0 1 0 6 7.2V8.8a9.2 9.2 0 0 0 5.4 1.7V6.4c-.8 0-1.5-.1-2.2-.2Z"/></svg></span><span class="platform-copy"><span class="platform-name">TikTok</span><span class="platform-detail">Hooks</span></span></label>
      <label class="platform-option"><input type="checkbox" value="youtube_shorts_script"><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="2.5" width="14" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10.5 9.2v5.6l4.6-2.8z"/></svg></span><span class="platform-copy"><span class="platform-name">YouTube</span><span class="platform-detail">Shorts script</span></span></label>
      <label class="platform-option"><input type="checkbox" value="reddit_post"><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="12" r="1.3" fill="currentColor"/><path d="M9 16c1.6 1 4.4 1 6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="platform-copy"><span class="platform-name">Reddit</span><span class="platform-detail">Post</span></span></label>
      <label class="platform-option"><input type="checkbox" value="facebook_post"><span class="platform-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.8-.1-1.7-.2-2.6-.2-2.6 0-4.4 1.6-4.4 4.5v2H7v3.1h2.8v8h3.7Z"/></svg></span><span class="platform-copy"><span class="platform-name">Facebook</span><span class="platform-detail">Post</span></span></label>
    </div>
  </section>

  <button id="generateBtn" class="generate-button" type="button"><span id="generateLabel">Generate drafts</span><span aria-hidden="true">→</span></button>
  <div id="loading" class="loading" hidden><span class="spinner"></span><span id="loadingText">Generating drafts…</span></div>
  <p id="errorMessage" class="error" role="alert" hidden></p>
  <p id="providerNote" class="provider-note" role="status" hidden></p>

  <section id="results" class="results" hidden>
    <div class="results-head"><h2>Drafts</h2><div class="results-actions"><span id="resultCount" class="source-label"></span><button id="copyAllBtn" class="text-button" type="button" hidden>Copy all</button><button id="clearResultsBtn" class="text-button" type="button" hidden>Clear</button></div></div>
    <div id="outputList" class="output-list"></div>
  </section>

  <section class="history-section" aria-labelledby="historyTitle">
    <div class="section-head"><h2 id="historyTitle">History</h2><button id="clearHistoryBtn" class="text-button" type="button" hidden>Clear history</button></div>
    <p id="historyEmpty" class="muted">Drafts you generate are saved here, on this device only.</p>
    <ul id="historyList" class="history-list"></ul>
  </section>

  <footer><span>HookEngine</span><a href="https://yazoniplay.github.io/HookEngine/account/privacy.html" target="_blank" rel="noopener">Privacy</a></footer>
</main>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
