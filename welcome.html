<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HookEngine</title>
<style>
:root{--paper:#fafaf7;--ink:#0c0c0c;--mute:#5d5d66;--signal:#ff5b2e;--line:#d9d8d1;--tint:#f1efe8;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:920px;margin:0 auto;padding:48px 40px}

.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.02em;opacity:0;animation:fade .6s .1s forwards}
.brand img{width:40px;height:40px;display:block}

h1{margin:54px 0 0;font-size:clamp(2.8rem,7.4vw,5.6rem);font-weight:800;letter-spacing:-.05em;line-height:.94;max-width:14ch;opacity:0;transform:translateY(30px);animation:rise .8s .25s cubic-bezier(.2,.9,.25,1.2) forwards}
h1 .hl{background:linear-gradient(var(--signal),var(--signal)) no-repeat 0 88%/0% 40%;animation:sweep .8s .9s cubic-bezier(.6,0,.2,1) forwards}

/* One source, three real platform marks lighting up in order */
.flow{margin-top:56px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;border:2px solid var(--ink);background:#fff;padding:24px;opacity:0;animation:fade .6s 1.4s forwards}
.src{font-size:16px;line-height:1.5;color:#26262a}
.src small{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.marks{display:flex;gap:10px}
.mark{width:64px;height:64px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--paper);color:var(--ink);opacity:.25;transform:translateY(8px);transition:opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1),background-color .3s}
.mark svg{width:28px;height:28px}
.mark.on{opacity:1;transform:none;background:var(--signal)}
.mark:nth-child(1){transition-delay:0s}
.run .mark.on{transition-delay:0s}

.done{margin-top:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;opacity:0;animation:fade .6s 2s forwards}
.done p{margin:0;color:var(--mute);font-size:14px}
.done p a{color:var(--ink);font-weight:700}
.cta{padding:16px 26px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:800 17px/1 var(--sans);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.cta:hover{transform:translate(-4px,-4px);box-shadow:5px 5px 0 var(--signal)}

.bit{position:fixed;top:24%;left:50%;width:9px;height:9px;pointer-events:none;opacity:0;animation:burst 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes fade{to{opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes sweep{to{background-size:100% 40%}}

@media (max-width:720px){
  .wrap{padding:32px 22px}
  .flow{grid-template-columns:1fr}
  .marks{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .brand,h1,.flow,.done{opacity:1;transform:none}
  h1 .hl{background-size:100% 40%}
  .mark{opacity:1;transform:none}
  .bit{display:none}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="icons/icon128.png" alt="" width="40" height="40">HookEngine</div>

  <h1>Posts from any article, <span class="hl">in one click.</span></h1>

  <div class="flow" aria-hidden="true">
    <div class="src"><small>Source</small>One article, one video or one selection.</div>
    <div class="marks" id="marks">
      <span class="mark" data-i="0"><svg viewBox="0 0 24 24"><use href="assets/platforms.svg#x" fill="currentColor"/></svg></span>
      <span class="mark" data-i="1"><svg viewBox="0 0 24 24"><use href="assets/platforms.svg#linkedin" fill="currentColor"/></svg></span>
      <span class="mark" data-i="2"><svg viewBox="0 0 24 24"><use href="assets/platforms.svg#tiktok" fill="currentColor"/></svg></span>
    </div>
  </div>

  <div class="done">
    <p>Free. No login. <a href="https://yazoniplay.github.io/HookEngine/account/privacy.html" target="_blank" rel="noopener">Privacy</a></p>
    <button class="cta" id="close" type="button">Done</button>
  </div>
</main>
<script src="welcome.js"></script>
</body>
</html>
